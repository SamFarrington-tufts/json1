<body>
    <h1>Problem 3</h1>

    <select id = "selectGenre"></select>
    <input type="button" value="Filter" id="btnFilter"> 
    <div id = "result"></div>

     <script>
        $.get("songs.json", function(data){
            // Creates an array to hold all genres of music. No repetition
            let genres = [];
            data.songList.forEach(function(song){
                song.genres.forEach(function(g){
                    if(!genres.includes(g)){
                        genres.push(g);
                    }
                });
            });

            // Populates the dropdown list with all genres
            let dropList = document.getElementById("selectGenre")
            genres.forEach(function(g){
                let opt = document.createElement("option");
                opt.value = g;
                op.text = g;
                dropList.appendChild(opt);
            });


        });
    </script>


</body>
</html>
