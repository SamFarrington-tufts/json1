<!DOCTYPE html>
<html>
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <style type = "text/css">
        body{font-family: 'Roboto', sans-serif;}
        #selectGenre{padding: 10px; margin: 20px; font-size: 20px;}
        #btnFilter{font-size: 20px; padding: 10px;}
        #btnFilter:hover{background-color: #000000; color: #ffffff;}
        #result{padding: 10px; margin: 20px; font-size: 20px;}
        #result ul li{margin-top: 10px;}

    </style>
    <meta charset="utf-8">
    <title>Problem 3</title>

</head>

<body>
    <h1>Problem 3</h1>

    <select id = "selectGenre"></select>
    <input type="button" value="Filter" id="btnFilter"> 
    <div id = "result"></div>

     <script>
        $.get("songs.json", function(data){
            // Creates an array to hold all genres of music. No repetition
            let genres = [];
            data.songList.forEach(function(song){
                song.genre.forEach(function(g){
                    if(!genres.includes(g)){
                        genres.push(g);
                    }
                });
            });

            // Populates the dropdown list with all genres
            let dropList = document.getElementById("selectGenre")
            genres.forEach(function(g){
                let opt = document.createElement("option");
                opt.value = g;
                opt.text = g;
                dropList.append(opt);
            });

            // Adds an event listener and function to the filter button
            document.getElementById("btnFilter").addEventListener("click", function(){
                // Gets the selected genre and stores it in a variable
                let selected = document.getElementById("selectGenre").value;

                // If the song is in the selected genre, creates a list element
                // with the song title and adds it to a ul
                let out = "<ul>";
                data.songList.forEach(function(song){
                    if(song.genre.includes(selected)){
                        out += "<li>" + song.title + "</li>";
                    }
                });
                out += "</ul>";

                document.getElementById("result").innerHTML = out;
            })


        });
    </script>


</body>
</html>
